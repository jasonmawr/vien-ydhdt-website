version: "3.9"

# Viện Y Dược Học Dân Tộc TP.HCM — Production Stack
# Oracle HIS (192.168.1.113:1521/medi) là hệ thống ngoài, KHÔNG containerize.
# Chạy: docker compose up -d

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vien-ydh-backend
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - ./backend/data:/app/data        # SQLite CMS database
      - ./backend/uploads:/app/uploads  # File uploads
      - ./backend/logs:/app/logs        # Log files
    ports:
      - "4000:4000"
    networks:
      - vien-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./vien-ydh-frontend
      dockerfile: Dockerfile
    container_name: vien-ydh-frontend
    restart: unless-stopped
    env_file: ./vien-ydh-frontend/.env.local
    depends_on:
      - backend
    networks:
      - vien-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: vien-ydh-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro       # SSL certificates
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - vien-internal

networks:
  vien-internal:
    driver: bridge
